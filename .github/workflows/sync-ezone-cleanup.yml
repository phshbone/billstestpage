name: Sync final E-Zone Help correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-ezone-cleanup.yml

permissions:
  contents: write

jobs:
  sync:
    if: "github.event.head_commit.message == 'chore: sync final Help correction'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy current cleanup candidate
        run: |
          curl -fsSL https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure/index.html -o ezone-cleanup/index.html
          curl -fsSL https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure/feedback.html -o ezone-cleanup/feedback.html
          curl -fsSL https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure/instructions.html -o ezone-cleanup/instructions.html
          curl -fsSL https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure/assets/campaign-sign-marker.svg -o ezone-cleanup/assets/campaign-sign-marker.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ezone-cleanup/index.html ezone-cleanup/feedback.html ezone-cleanup/instructions.html ezone-cleanup/assets/campaign-sign-marker.svg
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "preview: sync final Help correction"
          git push origin main
