name: Bridge scanner actions into app memory

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/bridge_scanner_memory.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test page
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scanner memory bridge
        run: python tools/bridge_scanner_memory.py

      - name: Verify bridge markers
        run: >-
          grep -q 'BBB SCANNER MEMORY BRIDGE v1' index.html &&
          grep -q 'const CUPBOARD_KEY="bbbCupboardItems"' index.html &&
          grep -q 'const FOOD_LOG_KEY="bbbFoodLogs"' index.html &&
          grep -q 'Ate it logged. This scanned product is now in your food history.' index.html &&
          grep -q 'Saved to Cupboard. Barcode product details were kept with it.' index.html &&
          grep -q 'canonicalVerdict' index.html

      - name: Commit validated bridge
        run: >-
          git config user.name 'bbb-test-bridge' &&
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' &&
          git add index.html &&
          (git diff --cached --quiet || (git commit -m 'Connect scanned products to Cupboard and food history' && git push origin HEAD:main))
