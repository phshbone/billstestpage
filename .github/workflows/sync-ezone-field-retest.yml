name: Sync E-Zone field retest build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-ezone-field-retest.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull current cleanup branch build
        run: |
          curl -fL "https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure/index.html" -o ezone-cleanup/index.html
          grep -q "sharedAudioContext" ezone-cleanup/index.html
          grep -q "SEND TO BOE" ezone-cleanup/index.html
      - name: Commit synced build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ezone-cleanup/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: sync E-Zone field retest build"
          git push origin main
