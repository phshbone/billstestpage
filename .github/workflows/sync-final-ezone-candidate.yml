name: Sync final E-Zone candidate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-final-ezone-candidate.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact cleanup candidate
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure'
          mkdir -p ezone-cleanup/assets
          curl -fsSL "$base/index.html" -o ezone-cleanup/index.html
          curl -fsSL "$base/feedback.html" -o ezone-cleanup/feedback.html
          curl -fsSL "$base/instructions.html" -o ezone-cleanup/instructions.html
          curl -fsSL "$base/assets/campaign-sign-marker.svg" -o ezone-cleanup/assets/campaign-sign-marker.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ezone-cleanup/index.html ezone-cleanup/feedback.html ezone-cleanup/instructions.html ezone-cleanup/assets/campaign-sign-marker.svg
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Preview already synchronized.'
            exit 0
          fi
          git commit -m 'preview: sync final E-Zone candidate'
          git push origin main
