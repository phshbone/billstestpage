name: Sync E-Zone Cleanup Preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-ezone-cleanup-preview.yml'

permissions:
  contents: write

jobs:
  sync-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test host
        uses: actions/checkout@v4

      - name: Pull verified cleanup branch files
        run: |
          mkdir -p ezone-cleanup/assets
          curl -fsSL https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure/index.html -o ezone-cleanup/index.html
          curl -fsSL https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure/instructions.html -o ezone-cleanup/instructions.html
          curl -fsSL https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure/feedback.html -o ezone-cleanup/feedback.html
          curl -fsSL https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure/assets/campaign-sign-marker.svg -o ezone-cleanup/assets/campaign-sign-marker.svg
          printf '%s\n' 'E-Zone cleanup preview — verified branch sync' > ezone-cleanup/TEST-BUILD.txt

      - name: Commit refreshed preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ezone-cleanup
          if git diff --cached --quiet; then
            echo 'Preview already current'
            exit 0
          fi
          git commit -m 'test: refresh E-Zone cleanup preview'
          git push
