name: Sync E-Zone shape-toggle preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-ezone-shape-toggle.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull exact cleanup candidate
        run: |
          curl -fsSL "https://raw.githubusercontent.com/phshbone/modzone/cleanup/ezone-structure/index.html" -o ezone-cleanup/index.html
      - name: Commit preview sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ezone-cleanup/index.html
          if git diff --cached --quiet; then
            echo "Preview already current"
          else
            git commit -m "chore: sync E-Zone shape-toggle preview"
            git push origin main
          fi
